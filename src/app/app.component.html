<router-outlet />
<main>
<!-- auth.isLoggedIn() is a signal, so this block re-renders whenever the login state changes -->
@if (auth.isLoggedIn()) {
<section class="card">
<h1>Home</h1>

@if (profile(); as user) {
<p>Welcome, <strong>{{ user.name }}</strong>!</p>
<p>Email: {{ user.email }}</p>
<p>User ID: {{ user.userId }}</p>
} @else if (error()) {
<p class="error">{{ error() }}</p>
} @else {
<p>Loading...</p>
}

<button type="button" (click)="logout()">Log out</button>
</section>
} @else {
<!-- (signedUp) listens to the output event from SignUp and then loads the profile -->
<app-sign-up (signedUp)="loadProfile()" />
}
</main>
